name: validation
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  validation:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep iPhone | tail -1 | awk -F '[()]' '{print $2}')
          xcrun simctl boot "$UDID" 2>/dev/null || true
          echo "Booted simulator: $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: |
          xcodebuild test \
            -scheme adadapted-swift-sdk \
            -destination "platform=iOS Simulator,id=$SIM_UDID"
