name: validation
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  validation:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Select available simulator
        id: sim
        run: |
          SIM_UDID=$(xcrun simctl list devices available | grep 'iPhone' | tail -1 | awk -F'[()]' '{print $2}')
          echo "udid=$SIM_UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator UDID: $SIM_UDID"

      - name: Run unit tests
        run: |
          xcodebuild test \
            -scheme adadapted-swift-sdk \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"
